<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Καλή Μέρα μου · My Good Day</title>
<meta name="description" content="Ένα λεπτό που αξίζει, κάθε μέρα. A minute worth having, every day.">
<meta name="theme-color" content="#0f3b5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Καλή Μέρα μου">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Έκδοση / Version: 8-10-2026 18:30 */
:root{
  --bg:#f4f1ea; --card:#ffffff; --ink:#1d2433; --soft:#5b6475; --line:rgba(127,127,127,.22);
  --blue:#1f6fd1; --teal:#0f9e8e; --gold:#e8a317; --rose:#e0566b; --violet:#7a4fd6; --green:#2f9a46;
  --red:#d33b3b; --orange:#e07a12;
  --shadow:0 6px 18px rgba(20,30,50,.12), 0 2px 4px rgba(20,30,50,.08);
  --radius:22px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#11151d; --card:#1b212d; --ink:#f2f4f8; --soft:#aab3c5; --shadow:0 6px 18px rgba(0,0,0,.45); }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  font-size:20px;line-height:1.5;min-height:100vh;padding-bottom:env(safe-area-inset-bottom);}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);
  border-radius:14px;padding:12px 14px;width:100%;min-height:54px}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid var(--blue);outline-offset:1px}
label.f{display:block;font-weight:700;margin:14px 0 6px}
.wrap{max-width:1320px;margin:0 auto;padding:0 16px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(8px + env(safe-area-inset-top)) 16px 8px;max-width:1320px;margin:0 auto}
.brand{font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:46px;height:46px;flex:none;border-radius:12px;box-shadow:var(--shadow)}
.topbtns{display:flex;gap:8px;align-items:center}
.tb{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:1.05rem;
  background:var(--card);padding:10px 16px;border-radius:999px;box-shadow:var(--shadow);white-space:nowrap}
.tb.home{padding:10px 14px}
.lang{display:flex;background:var(--card);border-radius:999px;box-shadow:var(--shadow);padding:4px}
.lang button{padding:7px 13px;border-radius:999px;font-weight:700;font-size:1rem;min-width:50px}
.lang button.on{background:var(--blue);color:#fff}
body.r-home #backBtn, body.r-home #homeBtn{display:none}
@media (max-width:420px){ .brand span{display:none} }

/* ---------- layout: main + projects on the right ---------- */
.layout{display:grid;grid-template-columns:1fr;gap:22px;align-items:start}
@media (min-width:1000px){
  .layout{grid-template-columns:minmax(0,1fr) 300px}
  aside{position:sticky;top:76px}
}
@media (max-width:999px){ body:not(.r-home) aside{display:none} }
aside h3{font-size:1.3rem;margin:6px 0 12px}
.plinks{display:flex;flex-direction:column;gap:12px}
.plink{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;
  color:#fff;text-decoration:none;background:var(--c);
  box-shadow:var(--shadow), inset 0 2px 0 rgba(255,255,255,.3), inset 0 -4px 0 rgba(0,0,0,.18)}
.plink:active{transform:scale(.97)}
.plink .pe{font-size:1.9rem;width:50px;height:50px;flex:none;display:grid;place-items:center;border-radius:14px;
  background:rgba(255,255,255,.22)}
.plink b{display:block;font-size:1.15rem}
.plink small{display:block;font-size:.92rem;line-height:1.3;opacity:.95}
.plink .go{margin-left:auto;font-size:1.4rem}

/* ---------- scene ---------- */
.scene{position:relative;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
  height:clamp(230px,30vw,340px);margin-top:6px}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.greet{position:absolute;left:0;right:0;bottom:0;padding:18px 22px;
  background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0));color:#fff}
.greet h1{margin:0;font-size:clamp(1.9rem,6vw,2.8rem);line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.greet p{margin:4px 0 0;font-size:1.1rem;opacity:.95;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.wave1{animation:drift 9s ease-in-out infinite alternate}
.wave2{animation:drift 13s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
.bird{animation:fly 26s linear infinite}
.bird.b2{animation-duration:34s;animation-delay:-12s}
@keyframes fly{from{transform:translateX(-80px)}to{transform:translateX(520px)}}
.star{animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:1}}
.glow{animation:pulse 6s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:.9}}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}
@media (max-width:600px){.tiles{grid-template-columns:1fr}}
.tile{position:relative;display:flex;align-items:center;gap:16px;text-align:left;width:100%;
  padding:20px;border-radius:var(--radius);color:#fff;min-height:110px;
  box-shadow:var(--shadow), inset 0 2px 0 rgba(255,255,255,.35), inset 0 -4px 0 rgba(0,0,0,.15);
  transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile{padding-right:70px}
.tile::after{content:"›";position:absolute;right:14px;top:50%;transform:translateY(-50%);
  width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.28);
  display:grid;place-items:center;font-size:2.1rem;font-weight:700;line-height:1;padding-bottom:4px}
.plink .go{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center}
details summary{list-style:none}
details summary::-webkit-details-marker{display:none}
.recipe details summary{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:2px solid var(--line);
  border-radius:999px;padding:8px 16px;margin-top:8px;color:var(--blue)}
.recipe details[open] summary{background:var(--blue);color:#fff;border-color:transparent}
.ingbox{margin-top:16px;background:var(--bg);border-radius:16px;padding:12px 14px}
.ingbox summary{cursor:pointer;font-weight:800;font-size:1.1rem;display:flex;justify-content:space-between;align-items:center}
.ingbox summary::after{content:"›";font-size:1.8rem;transform:rotate(90deg);transition:transform .2s}
.ingbox[open] summary::after{transform:rotate(-90deg)}
.chip.cat{font-size:1.05rem}
.chip small{opacity:.75;font-weight:600}
.chip.qa{background:var(--card);font-size:.95rem;padding:8px 12px}
#frQuick .chips{gap:8px}
.rh{display:flex;align-items:center;gap:10px}
.rc{font-size:1.5rem;width:44px;height:44px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none}
.cath{margin:22px 0 4px;padding:8px 12px;border-radius:12px;background:var(--bg)}
.okk{color:var(--green);font-weight:700}
.tile .ic{font-size:2.4rem;width:62px;height:62px;flex:none;display:grid;place-items:center;
  background:rgba(255,255,255,.22);border-radius:18px}
.tile h2{margin:0;font-size:1.4rem;line-height:1.2}
.tile p{margin:4px 0 0;font-size:1rem;opacity:.95}
.tile .tag{display:inline-block;margin-top:6px;font-size:.85rem;font-weight:800;
  background:rgba(255,255,255,.3);padding:2px 12px;border-radius:999px}
.t-minute{background:linear-gradient(135deg,#f0a92e,#e0566b)}
.t-money{background:linear-gradient(135deg,#21a67a,#0f7f8e)}
.t-rights{background:linear-gradient(135deg,#3a7fe0,#5a4fd6)}
.t-house{background:linear-gradient(135deg,#9a5fd8,#d04f9a)}
.t-a{background:linear-gradient(135deg,#2a8be0,#1667b8)}
.t-b{background:linear-gradient(135deg,#e88a1a,#d0581b)}
.t-c{background:linear-gradient(135deg,#2fa36b,#1b7d55)}
.t-d{background:linear-gradient(135deg,#7a5ae0,#5a3fb8)}

/* ---------- pages ---------- */
.page{display:none;padding-bottom:40px}
.page.on{display:block}
.back{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:1.1rem;
  background:var(--card);padding:12px 20px;border-radius:999px;box-shadow:var(--shadow);margin:6px 0 16px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:16px}
.h{font-size:1.75rem;margin:0 0 6px;line-height:1.2}
.h3{font-size:1.3rem;margin:0 0 8px}
.sub{color:var(--soft);margin:0 0 14px}
.small{font-size:.9rem;color:var(--soft)}
.big-btn{display:block;width:100%;padding:17px;border-radius:18px;font-size:1.2rem;font-weight:800;text-align:center;
  color:#fff;background:linear-gradient(135deg,#1f6fd1,#0f9e8e);margin-top:16px;text-decoration:none;
  box-shadow:var(--shadow), inset 0 2px 0 rgba(255,255,255,.3)}
.big-btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.big-btn.green{background:linear-gradient(135deg,#2f9a46,#1f7a3a)}
.big-btn.red{background:linear-gradient(135deg,#e0566b,#c23a50)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 160px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:14px;
  font-weight:800;font-size:1rem;background:var(--bg);border:2px solid var(--line);min-height:52px;color:var(--ink);text-decoration:none}
.btn.pri{background:var(--blue);color:#fff;border-color:transparent}
.steps{display:flex;gap:8px;justify-content:center;margin:0 0 16px}
.steps span{width:46px;height:8px;border-radius:9px;background:rgba(127,127,127,.25)}
.steps span.on{background:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:10px 14px;border-radius:999px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:1rem}
.chip.on{background:var(--blue);color:#fff;border-color:transparent}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.types .chip{border-radius:16px;padding:14px;font-size:1.05rem}
.result{border-radius:18px;padding:18px;margin-top:16px;font-size:1.1rem}
.result.ok{background:rgba(47,154,70,.14);border:2px solid rgba(47,154,70,.45)}
.result.no{background:rgba(211,59,59,.10);border:2px solid rgba(211,59,59,.4)}
.result.mid{background:rgba(232,163,23,.14);border:2px solid rgba(232,163,23,.5)}
.result .amt{font-size:2.2rem;font-weight:900;line-height:1.1;margin:4px 0}
.note{background:rgba(31,111,209,.08);border-left:6px solid var(--blue);padding:12px 14px;border-radius:12px;
  font-size:.95rem;margin-top:14px}
.src{font-size:.88rem;color:var(--soft);margin-top:12px}
.src a{color:var(--blue)}

/* thought / breath / game */
.thought{font-size:clamp(1.5rem,4.6vw,2rem);line-height:1.4;font-weight:600;margin:10px 0 8px;
  font-family:Georgia,"Times New Roman",serif}
.who{color:var(--soft);font-style:italic}
.breath{display:grid;place-items:center;height:300px}
.ball{width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#bfe9ff,#3aa0e8 55%,#1f5fbf);
  box-shadow:0 0 40px rgba(58,160,232,.55);transition:transform 4s ease-in-out}
.ball.in{transform:scale(2)}
.ball.out{transform:scale(1);transition-duration:6s}
.breath-word{font-size:1.8rem;font-weight:800;text-align:center;margin-top:-10px}
.breath-count{text-align:center;color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:520px;margin:0 auto}
@media (max-width:420px){.grid{grid-template-columns:repeat(3,1fr)}}
.mc{display:block;width:100%;padding:0;aspect-ratio:1;perspective:600px}
.mc .in{display:block;position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mc.flip .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:grid;place-items:center;box-shadow:var(--shadow)}
.mc .f{background:linear-gradient(135deg,#f0a92e,#e0566b);
  box-shadow:var(--shadow), inset 0 2px 0 rgba(255,255,255,.4), inset 0 -4px 0 rgba(0,0,0,.15)}
.mc .f::after{content:"✦";color:rgba(255,255,255,.75);font-size:1.6rem}
.mc .b{background:var(--card);transform:rotateY(180deg);font-size:clamp(2rem,9vw,3rem)}
.mc.done .b{background:linear-gradient(135deg,#dff7e6,#bdeccb)}
.moves{text-align:center;color:var(--soft);margin:12px 0 0}
.gamebar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.gamebar .sub{margin:0}
.snd{font-size:1.6rem;width:56px;height:56px;border-radius:50%;background:var(--bg);box-shadow:var(--shadow)}
.done-ic{font-size:4rem;text-align:center}

/* money */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.sum{gap:8px}.sum div{padding:10px 4px}.sum b{font-size:1.2rem}.sum span{font-size:.8rem;line-height:1.2;display:block}}
.sum div{background:var(--bg);border-radius:16px;padding:12px;text-align:center}
.sum b{display:block;font-size:1.5rem}
.sum span{font-size:.9rem;color:var(--soft)}
.item{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item .ie{font-size:1.9rem;width:52px;height:52px;flex:none;display:grid;place-items:center;border-radius:14px;background:var(--bg)}
.item .it{flex:1;min-width:0}
.item .it b{font-size:1.15rem;display:block;word-break:break-word}
.item .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.item .acts .btn{min-height:46px;padding:8px 12px;font-size:.95rem}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:800;font-size:.9rem;color:#fff}
.pill.g{background:var(--green)} .pill.o{background:var(--orange)} .pill.r{background:var(--red)} .pill.s{background:#7b8496}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:12px;flex:none;cursor:zoom-in}
.empty{text-align:center;color:var(--soft);padding:20px 0}
.photoPrev{max-width:100%;max-height:240px;border-radius:14px;margin-top:10px;display:block}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;z-index:50;padding:16px}
.overlay.on{display:grid}
.overlay img{max-width:100%;max-height:85vh;border-radius:12px}
.overlay button{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;background:#fff;color:#111;
  font-weight:800;padding:12px 18px;border-radius:999px}

/* recipes */
.recipe{border-top:1px solid var(--line);padding:14px 0}
.recipe:first-child{border:0}
.recipe b{font-size:1.15rem}
.recipe .miss{color:var(--orange);font-size:.95rem}
.recipe ol{margin:8px 0 0;padding-left:22px}
details summary{cursor:pointer;font-weight:700;color:var(--blue);margin-top:6px}

/* links list */
.gi{background:var(--bg);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.gi .gt{display:flex;align-items:center;gap:10px;font-size:1.12rem}
.gi .ge{font-size:1.6rem}
.gi p{margin:6px 0 10px;font-size:1rem}
.gi .btn{width:100%}
.olinks-old a{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--bg);
  margin-bottom:10px;text-decoration:none;color:var(--ink);font-weight:700}
.olinks-old a span:first-child{font-size:1.6rem}
.olinks-old a span:last-child{margin-left:auto;color:var(--blue)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:#1d2433;color:#fff;padding:14px 22px;border-radius:999px;font-weight:700;z-index:60;
  box-shadow:var(--shadow);opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.foot{text-align:center;color:var(--soft);font-size:.85rem;margin:24px 0 30px}
</style>
</head>
<body class="r-home">

<header class="top">
  <div class="brand"><svg class="logo" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
 <defs>
  <linearGradient id="lgbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f8fe8"/><stop offset="1" stop-color="#7cc4f7"/></linearGradient>
  <linearGradient id="lgsea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1673c9"/><stop offset="1" stop-color="#0b4f96"/></linearGradient>
  <radialGradient id="lgsun" cx=".4" cy=".35"><stop offset="0" stop-color="#fff6b0"/><stop offset=".6" stop-color="#ffd23f"/><stop offset="1" stop-color="#ffb000"/></radialGradient>
 </defs>
 <rect width="100" height="100" rx="22" fill="url(#lgbg)"/>
 <g stroke="#ffd23f" stroke-width="5.5" stroke-linecap="round">
  <line x1="50" y1="10" x2="50" y2="19"/><line x1="22" y1="22" x2="28.5" y2="28.5"/><line x1="78" y1="22" x2="71.5" y2="28.5"/>
  <line x1="10" y1="50" x2="18" y2="50"/><line x1="90" y1="50" x2="82" y2="50"/>
 </g>
 <circle cx="50" cy="52" r="22" fill="url(#lgsun)"/>
 <path d="M0 64 Q12.5 58 25 64 T50 64 T75 64 T100 64 V100 H0Z" fill="url(#lgsea)"/>
 <path d="M8 77 Q16 72 24 77 T40 77 T56 77 T72 77 T88 77" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
 <path d="M18 89 Q26 84 34 89 T50 89 T66 89 T82 89" stroke="#fff" stroke-opacity=".75" stroke-width="3.5" fill="none" stroke-linecap="round"/>
</svg><span data-t="appName"></span></div>
  <div class="topbtns">
    <button class="tb" id="backBtn" onclick="goBack()">← <span data-t="back"></span></button>
    <button class="tb home" id="homeBtn" onclick="go('home')" aria-label="home">🏠</button>
    <div class="lang" role="group" aria-label="Language">
      <button id="l-el" onclick="setLang('el')">ΕΛ</button>
      <button id="l-en" onclick="setLang('en')">EN</button>
    </div>
  </div>
</header>

<div class="wrap layout">
<main>

<!-- ================= HOME ================= -->
<section id="p-home" class="page on">
  <div class="scene">
    <svg id="sky" viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    <div class="greet"><h1 id="greet"></h1><p id="today"></p></div>
  </div>
  <div class="tiles">
    <button class="tile t-minute" onclick="go('minute')">
      <span class="ic">☀️</span><span><h2 data-t="tMinute"></h2><p data-t="tMinuteD"></p></span></button>
    <button class="tile t-money" onclick="go('money')">
      <span class="ic">💶</span><span><h2 data-t="tMoney"></h2><p data-t="tMoneyD"></p><span class="tag" id="moneyTag" hidden></span></span></button>
    <button class="tile t-rights" onclick="go('rights')">
      <span class="ic">⚖️</span><span><h2 data-t="tRights"></h2><p data-t="tRightsD"></p></span></button>
    <button class="tile t-house" onclick="go('house')">
      <span class="ic">🏠</span><span><h2 data-t="tHouse"></h2><p data-t="tHouseD"></p><span class="tag" id="fridgeTag" hidden></span></span></button>
  </div>
</section>

<!-- ================= MY MINUTE ================= -->
<section id="p-minute" class="page">
  <div class="steps"><span id="s1"></span><span id="s2"></span><span id="s3"></span></div>
  <div class="card" id="m-thought">
    <p class="sub" data-t="step1"></p>
    <div class="thought" id="thought"></div>
    <div class="who" id="who"></div>
    <button class="big-btn" onclick="minuteStep(2)" data-t="next"></button>
  </div>
  <div class="card" id="m-breath" hidden>
    <p class="sub" data-t="step2"></p>
    <div class="breath"><div class="ball" id="ball"></div></div>
    <div class="breath-word" id="bword"></div>
    <div class="breath-count" id="bcount"></div>
    <button class="big-btn alt" onclick="minuteStep(3)" data-t="skip"></button>
  </div>

   ΑΠΟΘΗΚΗ ΣΤΗ ΣΥΣΚΕΥΗ / ON-DEVICE STORAGE (IndexedDB)
   ===================================================================== */
const Store = {
  db:null, mem:{money:{},fridge:{}},
  open(){
    if(this.db) return Promise.resolve(this.db);
    return new Promise(res=>{
      try{
        const r=indexedDB.open("kalimera",1);
        r.onupgradeneeded=()=>{ const d=r.result; ["money","fridge"].forEach(s=>{ if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:"id"}); }); };
        r.onsuccess=()=>{ this.db=r.result; res(this.db); };
        r.onerror=()=>res(null);
      }catch(e){ res(null); }
    });
  },
  async all(s){ const d=await this.open(); if(!d) return Object.values(this.mem[s]);
    return new Promise(res=>{ const q=d.transaction(s).objectStore(s).getAll(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>res([]); }); },
  async put(s,o){ const d=await this.open(); if(!d){ this.mem[s][o.id]=o; return; }
    return new Promise(res=>{ const tx=d.transaction(s,"readwrite"); tx.objectStore(s).put(o); tx.oncomplete=()=>res(); tx.onerror=()=>res(); }); },
  async del(s,id){ const d=await this.open(); if(!d){ delete this.mem[s][id]; return; }
    return new Promise(res=>{ const tx=d.transaction(s,"readwrite"); tx.objectStore(s).delete(id); tx.oncomplete=()=>res(); tx.onerror=()=>res(); }); }
};

function drawScene(){
  const now=new Date(), h=now.getHours()+now.getMinutes()/60;
  let phase;
  if(h>=5 && h<8) phase="dawn"; else if(h>=8 && h<17.5) phase="day";
  else if(h>=17.5 && h<20.5) phase="dusk"; else phase="night";
  const P={
    dawn:{s1:"#2c3e7a",s2:"#f3a76b",s3:"#ffd9a0",sea1:"#3f6f9e",sea2:"#2a4f7a",sun:"#ffcf6b"},
    day: {s1:"#3d8fe0",s2:"#8cc8f5",s3:"#d9f0ff",sea1:"#2c9bd0",sea2:"#1b6fa8",sun:"#fff2a8"},
    dusk:{s1:"#3b2a6b",s2:"#e0566b",s3:"#ffb35c",sea1:"#5a4a8a",sea2:"#2f2a5a",sun:"#ff8a3d"},
    night:{s1:"#060b1f",s2:"#14234a",s3:"#28407a",sea1:"#14284f",sea2:"#0a1733",sun:"#f5f3e0"}
  }[phase];
  let t;
  if(phase==="night"){ const hh = h<5 ? h+24 : h; t=(hh-20.5)/8.5; } else t=(h-5)/15.5;
  t=Math.max(0,Math.min(1,t));
  const sx=40+t*320, sy=phase==="night" ? 40+Math.abs(t-.5)*60 : 132-Math.sin(t*Math.PI)*100;
  let stars="";
  if(phase==="night"||phase==="dawn"){
    for(let i=0;i<40;i++){ const x=(i*97)%400, y=(i*53)%110, r=(i%3)?0.9:1.6, d=(i%7)*0.4;
      stars+=`<circle class="star" cx="${x}" cy="${y}" r="${r}" fill="#fff" style="animation-delay:${d}s;opacity:${phase==="dawn"?.4:1}"/>`; }
  }
  const birds = (phase==="day"||phase==="dawn") ?
    `<g class="bird"><path d="M0 60 q6 -6 12 0 q6 -6 12 0" stroke="#2b3a4a" stroke-width="2" fill="none"/></g>
     <g class="bird b2"><path d="M0 85 q5 -5 10 0 q5 -5 10 0" stroke="#2b3a4a" stroke-width="1.8" fill="none"/></g>` : "";
  const sunOrMoon = phase==="night" ?
    `<circle cx="${sx}" cy="${sy}" r="16" fill="${P.sun}"/><circle cx="${sx+7}" cy="${sy-5}" r="14" fill="${P.s2}"/>` :
    `<circle class="glow" cx="${sx}" cy="${sy}" r="46" fill="url(#gg)"/><circle cx="${sx}" cy="${sy}" r="20" fill="${P.sun}"/>`;

  if(n===2){ showM("m-breath"); setSteps(2); startBreath(); }

let bTimers=[];
function stopBreath(){ bTimers.forEach(clearTimeout); bTimers=[]; const b=$("ball"); if(b) b.className="ball"; }
function startBreath(){
  stopBreath(); const ball=$("ball"), w=$("bword"), c=$("bcount");
  for(let i=0;i<3;i++){ const t0=i*10000+300;
    bTimers.push(setTimeout(()=>{ ball.className="ball in"; w.textContent=tr("inhale"); c.textContent=tr("breathN",i+1); },t0));
    bTimers.push(setTimeout(()=>{ ball.className="ball out"; w.textContent=tr("exhale"); },t0+4000)); }

let SOUND=true, AC=null;
try{ if(localStorage.getItem("km-sound")==="off") SOUND=false; }catch(e){}
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(AC.state==="suspended") AC.resume(); return AC; }
function tone(freq,start,dur,type,vol){ const a=ac(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain(), t=a.currentTime+start;
  o.type=type||"sine"; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+0.05); }
function sfx(k){ if(!SOUND) return;
  if(k==="flip") tone(660,0,0.12,"triangle",0.15);
  if(k==="match"){ tone(784,0,0.25,"sine",0.25); tone(1047,0.12,0.4,"sine",0.25); }
  if(k==="miss"){ tone(330,0,0.18,"sine",0.15); tone(262,0.12,0.28,"sine",0.15); }
  if(k==="win") [523,659,784,1047,1319].forEach((f,i)=>tone(f,i*0.13,0.5,"sine",0.22)); }
function toggleSound(){ SOUND=!SOUND; try{localStorage.setItem("km-sound",SOUND?"on":"off")}catch(e){} paintSound(); if(SOUND) sfx("flip"); }
function paintSound(){ const b=$("snd"); if(b) b.textContent=SOUND?"🔊":"🔇"; }
/* παιχνίδι / game */
let open=[], moves=0, found=0, lock=false; const pairs=6;
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function newGame(){
  const syms=shuffle(SYMBOLS.slice()).slice(0,pairs), deck=shuffle(syms.concat(syms));
  open=[]; moves=0; found=0; lock=false;
  const g=$("grid");
  g.innerHTML=deck.map((s,i)=>`<button class="mc" data-s="${s}" aria-label="card ${i+1}"><span class="in"><span class="f"></span><span class="b">${s}</span></span></button>`).join("");
  g.querySelectorAll(".mc").forEach(c=>c.addEventListener("click",()=>flip(c)));
  updateMoves();
}
function flip(c){
  if(lock||c.classList.contains("flip")) return;
  c.classList.add("flip"); open.push(c); sfx("flip");
  if(open.length===2){ moves++; updateMoves(); const [a,b]=open;
    if(a.dataset.s===b.dataset.s){ a.classList.add("done"); b.classList.add("done"); open=[]; found++;
      if(found===pairs){ updateMoves(); setTimeout(()=>sfx("win"),350); setTimeout(()=>{ if(ROUTE==="minute") minuteStep(4); },2200); }
      else setTimeout(()=>sfx("match"),250);
    } else { lock=true; setTimeout(()=>sfx("miss"),350);
      setTimeout(()=>{ a.classList.remove("flip"); b.classList.remove("flip"); open=[]; lock=false; },900); } }
}
function updateMoves(){ const m=$("moves"); if(!m) return; m.textContent=(found===pairs&&moves>0)?tr("won",moves):tr("moves",moves); }

const TYPE_E={sub:"🔁",bill:"🧾",deadline:"📅",warranty:"🛡️"};
const FREQ_M={m:1,q:3,y:12,o:0};
function itemDate(it){
  const d=parseISO(it.date); if(!d) return null;
  if(it.type==="warranty") return addMonths(d, it.months||24);
  if((it.type==="sub"||it.type==="bill") && FREQ_M[it.freq]){
    let n=d, guard=0; const t=addDays(new Date(),-1);
    while(n<t && guard<600){ n=addMonths(n,FREQ_M[it.freq]); guard++; }
    return n;
  }
  return d;
}
function monthly(it){ if(!(it.type==="sub"||it.type==="bill")) return 0; const m=FREQ_M[it.freq]; return m? (it.amount||0)/m : 0; }
function pill(days, type){
  if(days===null) return "";
  let cls="g", txt;
  if(days<0){ cls=type==="warranty"?"s":"r"; txt=tr("expired")+" · "+tr("ago",-days); }
  else if(days===0){ cls="r"; txt=tr("today"); }
  else { cls = days<=7?"r":days<=30?"o":"g"; txt=tr("in",days); }
  return `<span class="pill ${cls}">${txt}</span>`;
}
async function renderMoney(){
  const items=await Store.all("money");

    .sort((a,b)=>(a.days??99999)-(b.days??99999));

function hav(a,b){ const R=6371, r=Math.PI/180; const dLa=(b[3]-a[3])*r, dLo=(b[4]-a[4])*r;

let FL=null;
function calcFlight(){
  const F=DATA.flight, f=$("flFrom").value, t=$("flTo").value, A=ap(f), B=ap(t);
  const what=$("flWhat").dataset.v, why=$("flWhy").dataset.v;
  let km = (A&&B) ? Math.round(hav(A,B)) : num("flKm");
  const out=$("flResult"); $("flLetterCard").hidden=true; FL=null;
  const res=(cls,title,body)=>{ out.innerHTML=`<div class="result ${cls}"><b>${title}</b>${body}</div>`; };
  if(!km || (A&&B&&A===B)){ res("mid",tr("flSame"),""); return; }
  const depZ = A?A[5]:"eu", arrZ = B?B[5]:"eu";
  const euAir = $("flEuAir").dataset.v==="y";
  const covered = depZ==="eu"||depZ==="uk"|| ((arrZ==="eu"||arrZ==="uk") && euAir);
  const distTxt=`<p class="small">${tr("flDist",km.toLocaleString(L()?"el-GR":"en-GB"))}</p>`;
  if(!covered){ res("no",tr("flNo"),`<p>${tr("flNotCovered")}</p>`+distTxt); return; }
  const uk = depZ==="uk" || (depZ!=="eu" && arrZ==="uk");
  const intraEU = depZ==="eu" && arrZ==="eu";
  let band = km<=1500?"short": (km<=3500||intraEU)?"medium":"long";
  let amount = (uk?F.ukAmounts:F.amounts)[band];
  const cur = uk ? (v=>"£"+v) : eur;
  let notes=[];
  if(what==="delay"){
    const h=num("flHours");
    if(h<F.delayHours){ res("no",tr("flNo"),`<p>${tr("flShort")}</p>`+distTxt); return; }
    if(band==="long" && !intraEU && h<4){ amount=amount/2; notes.push(tr("flHalf")); }
  }
  if(what==="cancel" && $("flNotice").dataset.v==="early"){ res("no",tr("flNo"),`<p>${tr("flEarly")}</p>`+distTxt); return; }
  if(what==="cancel") notes.push(tr("flCancelReroute"));
  if(why==="ext"){ res("no",tr("flNo"),`<p>${tr("flExt")}</p>`+distTxt); return; }
  if(why==="unk") notes.push(tr("flUnk"));
  if(uk) notes.push(tr("flUK"));
  FL={amount, cur:uk?"GBP":"EUR", km, what, from:A?(L()?A[1]:A[2]):"", to:B?(L()?B[1]:B[2]):""};
  res("ok",tr("flYes"),`<div class="amt">${cur(amount)}</div><div>${tr("flPerPerson")}</div>`+distTxt+
     notes.map(n=>`<p>${n}</p>`).join("")+`<div class="note">${tr("flNext")}</div>`);
  $("flLetterCard").hidden=false;
}

function initTax(){

function taxOn(inc){ const B=DATA.tax2026.bands; let tax=0, prev=0;
  for(const [top,rate] of B){ if(inc>prev){ tax+=(Math.min(inc,top)-prev)*rate; } prev=top; } return tax; }
function calcTax(){
  const X=DATA.tax2026, inc=num("tInc"), fam=num("tFam")||inc, kids=Math.max(0,Math.floor(num("tKids"))),
        single=$("tSingle").dataset.v==="y";
  const limit = kids<=2?X.incomeLimits.upTo2: kids<=4?X.incomeLimits.upTo4: X.incomeLimits.more;
  const okInc = fam<=limit;
  let kidAmt=0; for(let i=0;i<kids;i++) kidAmt+=X.child[Math.min(i,2)]; if(single) kidAmt*=2;
  const rows=[
    [tr("tKidsL"), okInc?kidAmt:0],
    [tr("tRentL"), okInc?Math.min(num("tRent"),X.rentOrMortgageMax):0],
    [tr("tGreenL"), okInc?Math.min(num("tGreen"),X.greenMax):0],
    [tr("tInsL"), Math.min(num("tIns"),X.homeInsuranceMax)]
  ];
  const total=rows.reduce((s,r)=>s+r[1],0);
  const save=Math.max(0, taxOn(inc)-taxOn(Math.max(0,inc-total)));
  let html=`<div class="result ${save>0?"ok":"mid"}">`+
    rows.map(r=>`<div class="row" style="justify-content:space-between"><span>${r[0]}</span><b style="flex:0">${eur(r[1])}</b></div>`).join("")+
    `<hr style="border:0;border-top:1px solid var(--line)"><div class="row" style="justify-content:space-between"><span>${tr("tTotal")}</span><b style="flex:0">${eur(total)}</b></div>
     <p style="margin:10px 0 0">${tr("tSave")}:</p><div class="amt">${eur(Math.round(save))}</div>`;
  if(!okInc) html+=`<p>${tr("tOverLimit",limit.toLocaleString(L()?"el-GR":"en-GB"))}</p>`;
  if(inc<=X.taxFree) html+=`<p>${tr("tUnderFree",X.taxFree.toLocaleString(L()?"el-GR":"en-GB"))}</p>`;
  if(num("tGreen")>X.greenMax && okInc) html+=`<p>${tr("tGreenCarry")}</p>`;
  if(kids) html+=`<p class="small">${tr("tShare")}</p>`;
  $("tResult").innerHTML=html+"</div>";
}

R("fish","Γαρίδες σαγανάκι","Shrimp saganaki","shrimp tomato feta garlic",25,"Σοτάρετε σκόρδο και ρίξτε ντομάτα για 10 λεπτά.|Προσθέστε τις γαρίδες για 4 λεπτά.|Θρυμματίστε φέτα από πάνω και σερβίρετε.","Sauté garlic and add tomato for 10 minutes.|Add the shrimps for 4 minutes.|Crumble feta on top and serve.");
R("fish","Γαριδομακαρονάδα","Shrimp pasta","shrimp pasta tomato garlic",30,"Σοτάρετε σκόρδο και γαρίδες.|Ρίξτε ντομάτα και σιγοβράστε 10 λεπτά.|Ανακατέψτε με βρασμένα μακαρόνια.","Sauté garlic and shrimps.|Add tomato and simmer for 10 minutes.|Toss with boiled pasta.");
R("fish","Καλαμαράκια τηγανητά","Fried squid","squid flour lemon",25,"Κόψτε τα καλαμάρια σε ροδέλες.|Αλευρώστε τα και τηγανίστε σε καυτό λάδι 2–3 λεπτά.|Σερβίρετε με λεμόνι.","Cut the squid into rings.|Flour them and fry in hot oil for 2–3 minutes.|Serve with lemon.");
R("fish","Ψαρόσουπα","Fish soup","fish potato carrot onion celery lemon",60,"Βράστε πατάτες, καρότο, κρεμμύδι και σέλινο 25 λεπτά.|Προσθέστε το ψάρι για 15 λεπτά.|Ρίξτε λάδι και λεμόνι στο τέλος.","Boil potatoes, carrot, onion and celery for 25 minutes.|Add the fish for 15 minutes.|Add oil and lemon at the end.");

/* --- Όσπρια --- */
R("legumes","Φακές σούπα","Lentil soup","lentils onion carrot garlic tomato",45,"Βράστε τις φακές 5 λεπτά και πετάξτε το νερό.|Προσθέστε φρέσκο νερό, κρεμμύδι, καρότο, σκόρδο, ντομάτα και δάφνη.|Σιγοβράστε 35 λεπτά, ρίξτε λάδι και ξίδι στο τέλος.","Boil the lentils for 5 minutes and drain.|Add fresh water, onion, carrot, garlic, tomato and a bay leaf.|Simmer for 35 minutes; add oil and vinegar at the end.");
R("legumes","Φασολάδα","Bean soup","beans carrot onion celery tomato",90,"Μουλιάστε τα φασόλια από το βράδυ.|Βράστε τα με κρεμμύδι, καρότο, σέλινο και ντομάτα μέχρι να μαλακώσουν.|Ρίξτε λάδι και αλάτι στο τέλος.","Soak the beans overnight.|Boil with onion, carrot, celery and tomato until soft.|Add oil and salt at the end.");
R("legumes","Ρεβιθάδα","Chickpea stew","chickpeas onion lemon",120,"Μουλιάστε τα ρεβίθια από το βράδυ.|Βράστε τα με πολύ κρεμμύδι και λάδι μέχρι να λιώσουν (ή σε γάστρα στον φούρνο).|Σερβίρετε με λεμόνι.","Soak the chickpeas overnight.|Cook with plenty of onion and oil until very soft (or in a clay pot in the oven).|Serve with lemon.");
R("legumes","Φάβα","Fava (split pea purée)","fava onion lemon",50,"Βράστε τη φάβα με κρεμμύδι, ξαφρίζοντας.|Σιγοβράστε μέχρι να λιώσει και χτυπήστε τη.|Σερβίρετε με λάδι, λεμόνι και ψιλοκομμένο κρεμμύδι.","Boil the split peas with onion, skimming the foam.|Simmer until mushy and whisk smooth.|Serve with oil, lemon and chopped onion.");
R("legumes","Γίγαντες στον φούρνο","Baked giant beans","beans tomato onion herbs",120,"Μουλιάστε και βράστε τους γίγαντες μέχρι να μαλακώσουν.|Ανακατέψτε με σάλτσα ντομάτας, κρεμμύδι και μαϊντανό σε ταψί.|Ψήστε στους 180°C για 40 λεπτά.","Soak and boil the giant beans until soft.|Mix with tomato sauce, onion and parsley in a tray.|Bake at 180°C for 40 minutes.");

/* --- Λαδερά & λαχανικά --- */
R("lathera","Φασολάκια λαδερά","Green beans in tomato sauce","greenbeans potato tomato onion",50,"Τσιγαρίστε το κρεμμύδι σε λάδι.|Προσθέστε φασολάκια, πατάτες, ντομάτα και λίγο νερό.|Σιγοβράστε 40 λεπτά μέχρι να μείνουν με το λάδι τους.","Sauté the onion in oil.|Add green beans, potatoes, tomato and a little water.|Simmer for 40 minutes until the sauce thickens.");
R("lathera","Μπριάμ","Briam (roasted vegetables)","zucchini eggplant potato tomato onion pepper",70,"Κόψτε όλα τα λαχανικά σε κομμάτια.|Ανακατέψτε τα σε ταψί με λάδι, αλάτι και τριμμένη ντομάτα.|Ψήστε στους 190°C για περίπου 1 ώρα.","Cut all the vegetables into pieces.|Mix in a tray with oil, salt and grated tomato.|Bake at 190°C for about 1 hour.");
R("lathera","Γεμιστά","Stuffed vegetables","tomato pepper rice onion zucchini",90,"Αδειάστε ντομάτες, πιπεριές και κολοκυθάκια.|Ανακατέψτε ρύζι, κρεμμύδι, την ψίχα της ντομάτας, δυόσμο, λάδι και αλάτι.|Γεμίστε τα και ψήστε στους 190°C για περίπου 1 ώρα και 15 λεπτά.","Hollow out tomatoes, peppers and courgettes.|Mix rice, onion, the tomato pulp, mint, oil and salt.|Stuff and bake at 190°C for about 1 hour 15 minutes.");
R("lathera","Μπάμιες λαδερές","Okra in tomato sauce","okra tomato onion",60,"Ραντίστε τις μπάμιες με ξίδι και αφήστε τες 30 λεπτά.|Τσιγαρίστε κρεμμύδι και ρίξτε ντομάτα.|Προσθέστε τις μπάμιες και σιγοβράστε 30 λεπτά χωρίς ανακάτεμα.","Sprinkle the okra with vinegar and leave for 30 minutes.|Sauté onion and add tomato.|Add the okra and simmer for 30 minutes without stirring.");
R("lathera","Αγκινάρες α λα πολίτα","Artichokes à la polita","artichoke potato carrot onion lemon herbs",50,"Σοτάρετε κρεμμύδι, καρότα και πατάτες.|Προσθέστε τις αγκινάρες, λεμόνι, άνηθο και νερό.|Σιγοβράστε 30 λεπτά.","Sauté onion, carrots and potatoes.|Add the artichokes, lemon, dill and water.|Simmer for 30 minutes.");
R("lathera","Ιμάμ μπαϊλντί","Imam bayildi (stuffed aubergines)","eggplant onion tomato garlic",70,"Τηγανίστε ή ψήστε τις μελιτζάνες ολόκληρες και ανοίξτε τες στη μέση.|Γεμίστε τες με κρεμμύδι, σκόρδο και ντομάτα σοταρισμένα.|Ψήστε στους 180°C για 40 λεπτά.","Fry or roast the whole aubergines and slit them open.|Fill with sautéed onion, garlic and tomato.|Bake at 180°C for 40 minutes.");
R("lathera","Κουνουπίδι στιφάδο","Cauliflower stew","cauliflower onion tomato",50,"Τσιγαρίστε πολλά κρεμμύδια.|Ρίξτε ντομάτα και το κουνουπίδι σε φουντίτσες.|Σιγοβράστε 30 λεπτά.","Sauté plenty of onions.|Add tomato and the cauliflower florets.|Simmer for 30 minutes.");
R("lathera","Κολοκυθοκεφτέδες","Courgette fritters","zucchini feta eggs flour herbs",40,"Τρίψτε τα κολοκυθάκια και στύψτε το νερό τους.|Ανακατέψτε με φέτα, αυγό, αλεύρι και δυόσμο.|Τηγανίστε κουταλιές ή ψήστε στον φούρνο.","Grate the courgettes and squeeze out the water.|Mix with feta, egg, flour and mint.|Fry spoonfuls or bake in the oven.");
R("lathera","Πατάτες γιαχνί","Potatoes in tomato sauce","potato tomato onion",50,"Τσιγαρίστε το κρεμμύδι.|Ρίξτε πατάτες σε κομμάτια, ντομάτα και νερό.|Σιγοβράστε 35 λεπτά.","Sauté the onion.|Add potato chunks, tomato and water.|Simmer for 35 minutes.");
R("lathera","Σπανακόρυζο","Spinach rice","spinach rice onion lemon herbs",30,"Τσιγαρίστε το κρεμμύδι και το σπανάκι.|Ρίξτε το ρύζι, άνηθο και διπλάσιο νερό, βράστε 18 λεπτά.|Σερβίρετε με λεμόνι.","Sauté the onion and spinach.|Add the rice, dill and twice as much water; cook for 18 minutes.|Serve with lemon.");
R("lathera","Λαχανόρυζο","Cabbage rice","cabbage rice tomato onion",40,"Τσιγαρίστε κρεμμύδι και ψιλοκομμένο λάχανο.|Ρίξτε ρύζι, ντομάτα και νερό.|Σιγοβράστε 20 λεπτά.","Sauté onion and shredded cabbage.|Add rice, tomato and water.|Simmer for 20 minutes.");
R("lathera","Πρασόρυζο","Leek rice","leek rice lemon",35,"Τσιγαρίστε τα πράσα σε ροδέλες.|Ρίξτε ρύζι και νερό και σιγοβράστε 20 λεπτά.|Σερβίρετε με λεμόνι.","Sauté the sliced leeks.|Add rice and water and simmer for 20 minutes.|Serve with lemon.");

R("soup","Σούπα λαχανικών","Vegetable soup","carrot potato onion zucchini celery",40,"Κόψτε όλα τα λαχανικά σε κύβους.|Βράστε τα σε νερό με αλάτι 30 λεπτά.|Ρίξτε λάδι και λίγο λεμόνι στο τέλος.","Dice all the vegetables.|Boil in salted water for 30 minutes.|Add oil and a little lemon at the end.");
R("soup","Σούπα κολοκύθας","Pumpkin soup","pumpkin onion potato cream",40,"Σοτάρετε το κρεμμύδι.|Βράστε κολοκύθα και πατάτα σε νερό 25 λεπτά.|Χτυπήστε στο μπλέντερ και ρίξτε λίγη κρέμα.","Sauté the onion.|Boil pumpkin and potato in water for 25 minutes.|Blend and stir in a little cream.");
R("soup","Μανιταρόσουπα","Mushroom soup","mushrooms onion cream potato",35,"Σοτάρετε κρεμμύδι και μανιτάρια.|Ρίξτε πατάτα και νερό και βράστε 20 λεπτά.|Χτυπήστε στο μπλέντερ και ρίξτε κρέμα.","Sauté onion and mushrooms.|Add potato and water and boil for 20 minutes.|Blend and add cream.");
R("soup","Ντοματόσουπα με κριθαράκι","Tomato soup with orzo","tomato orzo onion",30,"Τσιγαρίστε το κρεμμύδι και ρίξτε τη ντομάτα.|Προσθέστε νερό και το κριθαράκι.|Βράστε 15 λεπτά και σερβίρετε με τυρί.","Sauté the onion and add the tomato.|Add water and the orzo.|Boil for 15 minutes and serve with cheese.");

R("salad","Μαρουλοσαλάτα","Lettuce salad","lettuce onion herbs lemon",10,"Ψιλοκόψτε μαρούλι, φρέσκο κρεμμυδάκι και άνηθο.|Ρίξτε λάδι και λεμόνι.","Chop lettuce, spring onion and dill.|Dress with oil and lemon.");
R("salad","Τονοσαλάτα","Tuna salad","tuna tomato cucumber onion olives",10,"Κόψτε ντομάτα, αγγούρι και κρεμμύδι.|Προσθέστε τόνο και ελιές.|Ρίξτε λάδι και λεμόνι.","Cut tomato, cucumber and onion.|Add tuna and olives.|Dress with oil and lemon.");
R("salad","Μελιτζανοσαλάτα","Aubergine dip","eggplant garlic lemon herbs",50,"Ψήστε τις μελιτζάνες ολόκληρες μέχρι να μαλακώσουν.|Ξεφλουδίστε και λιώστε τες.|Ανακατέψτε με σκόρδο, λάδι, λεμόνι και μαϊντανό.","Roast the whole aubergines until soft.|Peel and mash them.|Mix with garlic, oil, lemon and parsley.");
R("salad","Μπρόκολο λαδολέμονο","Broccoli with oil and lemon","broccoli lemon",15,"Βράστε το μπρόκολο 5 λεπτά.|Ρίξτε λάδι, λεμόνι και αλάτι.","Boil the broccoli for 5 minutes.|Dress with oil, lemon and salt.");

R("eggs","Αυγά με πατάτες","Eggs with potatoes","potato eggs",25,"Κόψτε τις πατάτες σε κύβους και τηγανίστε τες.|Ρίξτε τα αυγά χτυπημένα και ανακατέψτε μέχρι να ψηθούν.","Dice the potatoes and fry until golden.|Add the beaten eggs and stir until cooked.");

R("eggs","Αυγά μάτια με ψωμί","Fried eggs with bread","eggs bread",8,"Τηγανίστε τα αυγά σε λίγο λάδι.|Σερβίρετε με φρυγανισμένο ψωμί.","Fry the eggs in a little oil.|Serve with toasted bread.");

R("eggs","Τοστ με χαλλούμι και ντομάτα","Halloumi and tomato toast","bread halloumi tomato",10,"Βάλτε χαλλούμι και ντομάτα ανάμεσα σε δύο φέτες ψωμί.|Ψήστε στην τοστιέρα 4 λεπτά.","Put halloumi and tomato between two slices of bread.|Toast for 4 minutes.");

R("pies","Τυρόπιτα","Cheese pie","feta eggs phyllo milk",50,"Ανακατέψτε φέτα, αυγά και λίγο γάλα.|Στρώστε ανάμεσα σε βουτυρωμένα φύλλα.|Ψήστε στους 180°C για 35 λεπτά.","Mix feta, eggs and a little milk.|Layer between buttered filo sheets.|Bake at 180°C for 35 minutes.");
R("pies","Πρασόπιτα","Leek pie","leek feta phyllo eggs",70,"Μαράνετε τα πράσα.|Ανακατέψτε με φέτα και αυγά.|Στρώστε ανάμεσα σε φύλλα και ψήστε στους 180°C για 45 λεπτά.","Soften the leeks.|Mix with feta and eggs.|Layer between filo and bake at 180°C for 45 minutes.");
R("pies","Κολοκυθόπιτα","Courgette pie","zucchini feta phyllo eggs herbs",70,"Τρίψτε και στύψτε τα κολοκυθάκια.|Ανακατέψτε με φέτα, αυγά και δυόσμο.|Στρώστε ανάμεσα σε φύλλα και ψήστε στους 180°C για 45 λεπτά.","Grate and squeeze the courgettes.|Mix with feta, eggs and mint.|Layer between filo and bake at 180°C for 45 minutes.");
R("pies","Κοτόπιτα","Chicken pie","chicken phyllo onion cheese milk",80,"Βράστε και ξεψαχνίστε το κοτόπουλο.|Ανακατέψτε με σοταρισμένο κρεμμύδι, τυρί και λίγο γάλα.|Στρώστε ανάμεσα σε φύλλα και ψήστε στους 180°C για 40 λεπτά.","Boil and shred the chicken.|Mix with sautéed onion, cheese and a little milk.|Layer between filo and bake at 180°C for 40 minutes.");
R("pies","Σπιτική πίτσα","Homemade pizza","flour tomato cheese ham pepper mushrooms",60,"Ζυμώστε αλεύρι, μαγιά, νερό και λάδι και αφήστε 30 λεπτά.|Ανοίξτε τη ζύμη, βάλτε ντομάτα, τυρί, ζαμπόν, πιπεριά και μανιτάρια.|Ψήστε στους 220°C για 15 λεπτά.","Knead flour, yeast, water and oil and rest for 30 minutes.|Roll out, top with tomato, cheese, ham, pepper and mushrooms.|Bake at 220°C for 15 minutes.");

R("cy","Αφέλια","Afelia (pork in wine)","pork wine potato",120,"Μαρινάρετε το χοιρινό σε κόκκινο κρασί και κόλιαντρο από το βράδυ.|Σοτάρετε το κρέας και ρίξτε τη μαρινάδα.|Σιγοβράστε 1 ώρα. Σερβίρετε με πατάτες «τσακιστές» ή πουργούρι.","Marinate the pork in red wine and coriander seeds overnight.|Brown the meat and add the marinade.|Simmer for 1 hour. Serve with crushed potatoes or bulgur.");
R("cy","Κλέφτικο","Kleftiko","lamb potato onion lemon",240,"Βάλτε αρνί, πατάτες και κρεμμύδι σε πήλινο ή σε αλουμινόχαρτο.|Ρίξτε λεμόνι, ρίγανη, δάφνη, αλάτι και λίγο νερό.|Κλείστε καλά και ψήστε σιγά στους 160°C για 3–4 ώρες.","Put the lamb, potatoes and onion in a clay pot or foil.|Add lemon, oregano, bay leaf, salt and a little water.|Seal well and slow-cook at 160°C for 3–4 hours.");
R("cy","Κολοκάσι με χοιρινό","Colocasia with pork","colocasia pork celery tomato onion",120,"Καθαρίστε το κολοκάσι χωρίς να το βρέξετε και «τσακίστε» το σε κομμάτια.|Σοτάρετε χοιρινό, κρεμμύδι και σέλινο, ρίξτε το κολοκάσι.|Προσθέστε ντομάτα και νερό και σιγοβράστε 1,5 ώρα.","Peel the colocasia without wetting it and snap it into pieces.|Brown pork, onion and celery, then add the colocasia.|Add tomato and water and simmer for 1.5 hours.");
R("cy","Πουργούρι πιλάφι","Bulgur pilaf","bulgur onion butter orzo",30,"Τσιγαρίστε το κρεμμύδι και λίγο φιδέ ή κριθαράκι σε βούτυρο.|Ρίξτε το πουργούρι και διπλάσιο ζωμό ή νερό.|Σιγοβράστε 15 λεπτά και αφήστε σκεπασμένο 10 λεπτά.","Sauté onion and a little vermicelli or orzo in butter.|Add the bulgur and twice as much stock or water.|Simmer for 15 minutes, then rest covered for 10 minutes.");
R("cy","Τραχανάς σούπα με χαλλούμι","Trahanas soup with halloumi","trahanas halloumi",30,"Μουσκέψτε τον τραχανά σε νερό ή ζωμό 1 ώρα.|Βράστε τον ανακατεύοντας μέχρι να γίνει κρεμώδης.|Ρίξτε χαλλούμι σε κυβάκια στο τέλος.","Soak the trahanas in water or stock for 1 hour.|Boil, stirring, until creamy.|Add diced halloumi at the end.");

async function renderFridge(){
  const li=L()?1:2;
  $("frQuick").innerHTML = FQ.map(g=>`<h3 class="h3" style="margin:16px 0 8px">${g[0]} ${L()?g[1]:g[2]}</h3><div class="chips">`+
     g[3].map((x,j)=>`<button class="chip qa" onclick="quickFridge(${FQ.indexOf(g)},${j})">${x[0]} ${x[li]} <small>· ${tr("frDays",x[3])}</small></button>`).join("")+`</div>`).join("");
  if(!$("frDate").value) $("frDate").value=iso(addDays(new Date(),3));
  const items=(await Store.all("fridge")).map(it=>({it,days:daysUntil(parseISO(it.date))})).sort((a,b)=>a.days-b.days);
  $("fridgeList").innerHTML = items.length ? items.map(({it,days})=>`<div class="item">
     <span class="ie">${it.e||"🥫"}</span><div class="it"><b>${esc(it.name)}</b>
     <div class="row" style="align-items:center;margin-top:4px"><input type="date" value="${it.date}" onchange="setFridgeDate('${it.id}',this.value)" style="flex:0 1 190px;min-height:46px;padding:8px">${pill(days)}</div>
     <div class="acts"><button class="btn" onclick="delFridge('${it.id}',1)">${tr("ate")}</button><button class="btn" onclick="delFridge('${it.id}',0)">${tr("threw")}</button></div></div></div>`).join("")
     : `<div class="empty">${tr("emptyFridge")}</div>`;
  let n=0; try{ n=+(localStorage.getItem("km-eaten-"+new Date().getFullYear())||0); }catch(e){}
  $("eatenNote").textContent = n ? tr("savedCount",n) : "";
}
async function quickFridge(g,j){
  const x=FQ[g][3][j];
  await Store.put("fridge",{id:newId(),name:L()?x[1]:x[2],date:iso(addDays(new Date(),x[3])),e:x[0],ing:x[4]});
  if(x[4]) HAVE.add(x[4]);
  const dd=addDays(new Date(),x[3]); toast("✓ "+x[0]+" "+(L()?x[1]:x[2])+" → "+dd.getDate()+"/"+(dd.getMonth()+1));
  renderFridge();
}
async function addFridge(){
  const n=$("frName").value.trim(); if(!n){ toast(tr("needName")); $("frName").focus(); return; }
  await Store.put("fridge",{id:newId(),name:n,date:$("frDate").value||iso(addDays(new Date(),3)),e:"🥫",ing:""});
  $("frName").value=""; renderFridge();
}
async function setFridgeDate(id,v){ const it=(await Store.all("fridge")).find(x=>x.id===id); if(it&&v){ it.date=v; await Store.put("fridge",it); renderFridge(); } }
async function delFridge(id,eaten){
  if(eaten){ try{ const k="km-eaten-"+new Date().getFullYear(); localStorage.setItem(k, +(localStorage.getItem(k)||0)+1); }catch(e){} }
  await Store.del("fridge",id); renderFridge();
}

/* =====================================================================
   ΤΙ ΜΑΓΕΙΡΕΥΩ / WHAT CAN I COOK
   ===================================================================== */
let HAVE=new Set(), cookAuto=false, CAT="all";
async function initCook(){
  if(!cookAuto){
    const fr=await Store.all("fridge");
    fr.forEach(f=>{ if(f.ing){ HAVE.add(f.ing); return; }
      const n=(f.name||"").toLowerCase();
      for(const k in ING){ const a=ING[k][1].toLowerCase().split(/[ /]+/)[0].slice(0,5), b=ING[k][2].toLowerCase().split(/[ /]+/)[0].slice(0,5);
        if(n.includes(a)||n.includes(b)) HAVE.add(k); } });
    cookAuto=true;
  }
  const li=L()?1:2;
  $("catChips").innerHTML=Object.entries(CATS).map(([k,v])=>{
    const n = k==="all"?RECIPES.length:RECIPES.filter(r=>r.c===k).length;
    return `<button class="chip cat${CAT===k?" on":""}" onclick="setCat('${k}')">${v[0]} ${v[li]} <small>(${n})</small></button>`; }).join("");
  $("ingSum").textContent = HAVE.size ? tr("myIngN",HAVE.size) : tr("myIng");
  $("ingChips").innerHTML=Object.entries(ING).map(([k,v])=>`<button class="chip${HAVE.has(k)?" on":""}" onclick="toggleIng('${k}')">${v[0]} ${v[li]}</button>`).join("");
  renderRecipes();
}
function setCat(k){ CAT=k; initCook(); }
function toggleIng(k){ HAVE.has(k)?HAVE.delete(k):HAVE.add(k); initCook(); }
function clearIng(){ HAVE.clear(); initCook(); }
function renderRecipes(){
  const li=L()?0:1;
  let list=RECIPES.filter(r=>CAT==="all"||r.c===CAT).map(r=>({r,miss:r.i.filter(x=>!HAVE.has(x)), hit:r.i.filter(x=>HAVE.has(x)).length}));
  if(HAVE.size){ if(CAT==="all") list=list.filter(x=>x.hit>0); list.sort((a,b)=>a.miss.length-b.miss.length||b.hit-a.hit); }
  if(!list.length){ $("recipes").innerHTML=`<div class="empty">${tr("noRecipe")}</div>`; return; }
  const card=({r,miss})=>`<div class="recipe"><div class="rh"><span class="rc">${CATS[r.c][0]}</span><b>${r.n[li]}</b></div>
    <div class="small">⏱ ${tr("mins",r.t)} · ${r.i.map(x=>ING[x][0]).join(" ")}</div>
    ${HAVE.size?`<div class="${miss.length?"miss":"okk"}">${miss.length?tr("missing",miss.map(x=>ING[x][li+1]).join(", ")):tr("have")}</div>`:""}
    <details><summary>${tr("steps")} ›</summary><p class="small"><b>${tr("ings")}:</b> ${r.i.map(x=>ING[x][li+1]).join(", ")}</p><ol>${r.s[li].map(s=>`<li>${s}</li>`).join("")}</ol></details></div>`;
  if(CAT==="all" && !HAVE.size){
    $("recipes").innerHTML=Object.keys(CATS).filter(k=>k!=="all").map(k=>{
      const g=list.filter(x=>x.r.c===k); if(!g.length) return "";
      return `<h3 class="h3 cath">${CATS[k][0]} ${CATS[k][li+1]} <small>(${g.length})</small></h3>`+g.map(card).join(""); }).join("");
  } else {
    $("recipes").innerHTML=`<p class="small">${tr("recN",list.length)}</p>`+list.map(card).join("");
  }
}

function E(){ return DATA.electricity||{}; }
function marginal(){ const e=E(); if(e.energy==null) return e.pricePerKwh||0.3;
  return (e.energy+e.network+e.fuel+(e.pso||0))*(1+e.vat)+(e.res||0); }
function fixed2m(){ const e=E(); return ((e.meterFee||0)+(e.supplyFee||0))*(1+(e.vat||0)); }
let pwInit=false;
function initPower(){
  const sel=$("pwApp"), prev=sel.value;
  sel.innerHTML=APPS.map((a,i)=>`<option value="${i}">${a[0]} ${i===APPS.length-1?tr("pwCustom"):(L()?a[1]:a[2])}</option>`).join("");
  if(prev) sel.value=prev;
  if(!pwInit){ sel.value="0"; pwPreset();
    let saved=null; try{ saved=localStorage.getItem("km-price-user"); }catch(e){}
    $("pwPrice").value = saved || (Math.round(marginal()*10000)/10000);
    $("pwPrice").addEventListener("input",()=>{ try{ localStorage.setItem("km-price-user",$("pwPrice").value); }catch(e){} });
    pwInit=true; }
  const e=E();
  $("pwNote").innerHTML=trf("pwNoteT",{p:(marginal()*100).toLocaleString(L()?"el-GR":"en-GB",{maximumFractionDigits:2})+(L()?" σεντ/kWh":" cents/kWh"),f:eur2(fixed2m())})+
    (e.fuelPeriodEl?`<br>${tr("pwFrom",L()?e.fuelPeriodEl:e.fuelPeriodEn)}`:"")+` <a href="${e.source||"https://www.eac.com.cy"}" target="_blank" rel="noopener">ΑΗΚ / EAC ↗</a>`;
  renderPwList();
}
function pwPreset(){ const a=APPS[+$("pwApp").value]; $("pwW").value=a[3]||""; $("pwH").value=a[4]; $("pwResult").innerHTML=""; }
function calcPower(){
  const a=APPS[+$("pwApp").value], w=num("pwW"), h=num("pwH"), d=num("pwD")||30, p=num("pwPrice");
  const perH=w/1000*p, perD=perH*h, perM=perD*d, perY=perM*12;
  const tip=L()?a[5]:a[6];
  $("pwResult").innerHTML=`<div class="result ok">
    <div class="sum"><div><b>${eur2(perH)}</b><span>${tr("pwHour")}</span></div><div><b>${eur2(perD)}</b><span>${tr("pwDay")}</span></div><div><b>${eur2(perM)}</b><span>${tr("pwMonth")}</span></div></div>
    <p style="text-align:center;margin:10px 0 0">${tr("pwYear")}: <b>${eur(Math.round(perY))}</b></p>
    ${tip?`<div class="note">${tr("pwTip",tip)}</div>`:""}
    <button class="big-btn alt" onclick="pwAdd()">${tr("pwAdd")}</button></div>`;
  window._pwLast={name:(+$("pwApp").value===APPS.length-1)?(w+" W"):(a[0]+" "+(L()?a[1]:a[2])), perM};
}
function pwGet(){ try{ return JSON.parse(localStorage.getItem("km-pwlist")||"[]"); }catch(e){ return []; } }
function pwAdd(){ if(!window._pwLast) return; const l=pwGet(); l.push(window._pwLast); try{localStorage.setItem("km-pwlist",JSON.stringify(l))}catch(e){} renderPwList(); toast(tr("saved")); }
function pwClear(){ try{localStorage.removeItem("km-pwlist")}catch(e){} renderPwList(); }
function renderPwList(){
  const l=pwGet(); $("pwListCard").hidden=!l.length; if(!l.length) return;
  const tot=l.reduce((s,x)=>s+x.perM,0);
  $("pwList").innerHTML=l.map(x=>`<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(x.name)}</span><b style="flex:0">${eur2(x.perM)}</b></div>`).join("")+
    `<div class="row" style="justify-content:space-between;padding:10px 0"><b>${tr("pwTotal")}</b><b style="flex:0;font-size:1.4rem">${eur2(tot)}</b></div>`;
}
/* Λογαριασμός ΑΗΚ: ίδια σειρά και στρογγυλοποίηση με τον πραγματικό λογαριασμό
   EAC bill: same order and rounding as the real bill */
function calcBill(){
  const e=E(), k=num("billKwh"); if(!k||e.energy==null){ return; }
  const r2=x=>Math.round(x*100)/100;
  const L1=[[tr("bEnergy")+` (${k} × €${e.energy})`,r2(k*e.energy)],[tr("bNetwork")+` (${k} × €${e.network})`,r2(k*e.network)],
            [tr("bMeter"),e.meterFee],[tr("bSupply"),e.supplyFee],[tr("bFuel")+` (${k} × €${e.fuel})`,r2(k*e.fuel)],[tr("bPso")+` (${k} × €${e.pso})`,r2(k*e.pso)]];
  const pre=r2(L1.reduce((s,x)=>s+x[1],0)), res=r2(k*e.res), vat=r2(pre*e.vat), tot=r2(pre+res+vat);
  const row=(a,b,bold)=>`<div class="row" style="justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)${bold?";font-weight:800":""}"><span style="flex:1 1 60%">${a}</span><span style="flex:0 0 auto">${eur2(b)}</span></div>`;
  $("billResult").innerHTML=`<div class="result ok">`+L1.map(x=>row(x[0],x[1])).join("")+row(tr("bRes")+` (${k} × €${e.res})`,res)+row(tr("bVat")+` ${Math.round(e.vat*100)}%`,vat)+
    `<p style="margin:12px 0 0">${tr("bTotal")}:</p><div class="amt">${eur2(tot)}</div><p>${tr("bPerKwh",eur2(tot/k))} ${tr("bMonth",eur2(tot/2))}</p></div>`;
}

function lifeItem(){ const [g,i]=($("rpType").value||"0-0").split("-").map(Number); return LIFE[g][3][i]; }
function initRepair(){
  const sel=$("rpType"), prev=sel.value, li=L()?1:2;
  sel.innerHTML=LIFE.map((g,gi)=>`<optgroup label="${g[0]} ${g[li]}">`+g[3].map((a,i)=>`<option value="${gi}-${i}">${a[0]} ${a[li]}</option>`).join("")+`</optgroup>`).join("");
  if(prev) sel.value=prev;
  sel.onchange=rpVis; rpVis();
}
function rpVis(){ const a=lifeItem(); $("rpNewLbl").textContent = a[6]?tr("rpNewV"):tr("rpNew"); $("rpResult").innerHTML=""; }
function calcRepair(){
  const a=lifeItem(), age=num("rpAge"), cost=num("rpCost"), nw=num("rpNew");
  const out=$("rpResult"), tip=L()?a[4]:a[5];
  const tipHtml = tip?`<div class="note"><b>${tr("rpTip")}</b> ${tip}</div>`:"";
  if(age<2 && age>=0 && $("rpAge").value!==""){
    out.innerHTML=`<div class="result ok"><b>${tr("rpFree")}</b><button class="big-btn" onclick="go('rights/warranty')">${tr("rpFreeBtn")} ›</button>${tipHtml}</div>`; return; }
  if(!cost||!nw){ toast(tr("rpNeed")); return; }
  const ratio=cost/nw, lifeP=Math.min(150,Math.round(age/a[3]*100));
  let cls, title;
  if(ratio>0.5 || (lifeP>=80 && ratio>0.3)){ cls="no"; title=tr("rpReplace"); }
  else if(ratio>0.35 || lifeP>=70){ cls="mid"; title=tr("rpThink"); }
  else { cls="ok"; title=tr("rpRepair"); }
  out.innerHTML=`<div class="result ${cls}"><b style="font-size:1.4rem">${title}</b>
    <p>${trf("rpWhy1",{p:Math.round(ratio*100)})}</p>${age?`<p>${trf("rpWhy2",{p:lifeP,y:a[3]})}</p>`:`<p>${tr("rpLife",a[3])}</p>`}
    ${tipHtml}<div class="note">${tr("rpRule")}</div></div>`;
}
